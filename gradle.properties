org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=false
org.gradle.parallel=true

mod_id=meshi
mod_version=0.1.0
mod_group_id=com.meshi

minecraft_version=1.21.1

# NeoForge build to compile against. Any 21.1.x build works on a 21.1.x server.
neo_version=21.1.172

# GeckoLib. "4.+" means "newest 4.x for 1.21.1". Once the build works you can pin this
# to the exact version in your server's mods folder (e.g. 4.7.5) so both match.
geckolib_version=4.+
